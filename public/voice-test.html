<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Test Recorder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover:not(:disabled) {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #recordBtn {
      background: #ef4444;
      color: white;
    }
    #stopBtn {
      background: #3b82f6;
      color: white;
    }
    #status {
      padding: 12px;
      background: white;
      border-radius: 8px;
      min-height: 24px;
      color: #666;
    }
    .info {
      margin-top: 20px;
      padding: 12px;
      background: #e0f2fe;
      border-radius: 8px;
      font-size: 14px;
      color: #0369a1;
    }
  </style>
</head>
<body>
  <h1>Voice Test Recorder</h1>
  
  <div class="controls">
    <button id="recordBtn">Record (5 sec)</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  
  <div id="status">Ready to record</div>
  
  <div class="info">
    <strong>Note:</strong> Uses Chrome/Edge for best WebM support. Auto-stops after 5 seconds or click Stop manually.
  </div>

  <script>
    const recordBtn = document.getElementById('recordBtn')
    const stopBtn = document.getElementById('stopBtn')
    const status = document.getElementById('status')
    
    const PREFERRED = 'audio/webm;codecs=opus'
    
    function getMimeType() {
      if (MediaRecorder.isTypeSupported(PREFERRED)) {
        return PREFERRED
      }
      // Fallback to browser default
      return ''
    }
    
    let mediaRecorder
    let audioChunks = []
    let stopTimer
    
    recordBtn.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
        
        const mimeType = getMimeType()
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {})
        audioChunks = []
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            audioChunks.push(e.data)
          }
        }
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' })
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = 'test-voice.webm'
          document.body.appendChild(a)
          a.click()
          document.body.removeChild(a)
          URL.revokeObjectURL(url)
          status.textContent = 'Downloaded test-voice.webm'
          stream.getTracks().forEach(track => track.stop())
        }
        
        mediaRecorder.start()
        status.textContent = 'Recording...'
        recordBtn.disabled = true
        stopBtn.disabled = false
        
        // Auto-stop after 5 seconds
        stopTimer = setTimeout(() => {
          stopBtn.click()
        }, 5000)
        
      } catch (err) {
        status.textContent = `Error: ${err.message}`
        console.error('Recording error:', err)
      }
    }
    
    stopBtn.onclick = () => {
      if (stopTimer) {
        clearTimeout(stopTimer)
        stopTimer = null
      }
      
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop()
      }
      
      recordBtn.disabled = false
      stopBtn.disabled = true
      status.textContent = 'Processing...'
    }
  </script>
</body>
</html>
