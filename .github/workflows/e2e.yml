name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: E2E Tests (${{ matrix.browser }})
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        os: [ubuntu-latest]
        include:
          - browser: webkit
            os: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Run E2E tests
        run: pnpm test:e2e --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: test-results/**/*.png
          retention-days: 30

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.browser }}
          path: test-results/**/*.webm
          retention-days: 30

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}
          path: test-results/**/*.zip
          retention-days: 30

  report:
    name: Test Report
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-test-results

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'all-test-results/**/junit.xml'
          check_name: E2E Test Results
          fail_on_failure: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## 🎭 E2E Test Results\n\n';
            
            // Find result files
            const resultsDir = 'all-test-results';
            
            try {
              const browsers = ['chromium', 'firefox', 'webkit'];
              
              for (const browser of browsers) {
                comment += `### ${browser.charAt(0).toUpperCase() + browser.slice(1)}\n`;
                
                const resultPath = path.join(resultsDir, `test-results-${browser}`, 'results.json');
                
                if (fs.existsSync(resultPath)) {
                  const results = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
                  const total = results.stats?.tests || 0;
                  const passed = results.stats?.passed || 0;
                  const failed = results.stats?.failed || 0;
                  const skipped = results.stats?.skipped || 0;
                  
                  comment += `- ✅ Passed: ${passed}\n`;
                  comment += `- ❌ Failed: ${failed}\n`;
                  comment += `- ⏭️ Skipped: ${skipped}\n`;
                  comment += `- 📊 Total: ${total}\n\n`;
                } else {
                  comment += `- ⚠️ Results not found\n\n`;
                }
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Error creating comment:', error);
            }

