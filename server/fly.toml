app = 'fb-consulting-websocket'
primary_region = 'iad'

[build]
  dockerfile = '../Dockerfile.websocket'

[env]
  NODE_ENV = 'production'
  GEMINI_API_KEY = '${GEMINI_API_KEY}'
  # GEMINI_LIVE_MODEL = 'gemini-2.5-flash-native-audio-preview-09-2025'
  # Optional override - if not set, uses DEFAULT_VOICE from src/config/constants.ts
  # Keeping this commented so code default is used (easier to update in one place)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "45s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
